<main>
  <h1>Learning ({{ modules.length }} Modules and {{ totalTopics }} topics)</h1>

  <div class="learning-row">
    <div class="learning-items">
      <ul>
        @for (module of modules; track module.id) {
        <li>
          <button type="button" (click)="openModule(module.id)" class="module-link"
            [class.selected]="selectedModuleId() === module.id">
            {{ module.title }} ({{ module.topics.length }} topics)
          </button>
        </li>
        }
      </ul>
    </div>

    <div class="learning-image">
      <img src="assets/images/learning-page-illustration.svg" alt="Learning illustration" />
    </div>
  </div>
</main>
